<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Business Pro - Enterprise Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts for Clean UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // State Management
            const [token, setToken] = useState(localStorage.getItem('token') || null);
            const [role, setRole] = useState(localStorage.getItem('role') || null);
            const [lang, setLang] = useState('EN'); // EN or SI
            const [view, setView] = useState('dashboard'); // Navigation View
            const [authForm, setAuthForm] = useState({ username: '', password: '', fullName: '', companyName: '', phone: '', email: '' });
            const [isRegister, setIsRegister] = useState(false);

            // App Data States
            const [products, setProducts] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [orders, setOrders] = useState([]);
            const [employees, setEmployees] = useState([]);

            // Form States
            const [orderForm, setOrderForm] = useState({ customerId: '', itemId: '', quantity: 1, paymentMethod: 'Cash' });

            useEffect(() => {
                if (token) {
                    fetchData();
                }
            }, [token]);

            const fetchData = async () => {
                const headers = { 'Authorization': `Bearer ${token}` };
                
                const resProds = await fetch('http://localhost:5000/api/products', { headers });
                setProducts(await resProds.json());

                const resCusts = await fetch('http://localhost:5000/api/customers', { headers });
                setCustomers(await resCusts.json());

                const resOrders = await fetch('http://localhost:5000/api/orders', { headers });
                setOrders(await resOrders.json());

                if (role === 'ADMIN') {
                    const resEmps = await fetch('http://localhost:5000/api/employees', { headers });
                    setEmployees(await resEmps.json());
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: authForm.username, password: authForm.password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    setToken(data.token);
                    setRole(data.role);
                } else {
                    alert(data.error);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(authForm)
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Registration Successful! Company Code: ${data.companyCode}`);
                    setIsRegister(false);
                } else {
                    alert(data.error);
                }
            };

            const handleCreateOrder = async (e) => {
                e.preventDefault();
                const selectedCust = customers.find(c => c.id == orderForm.customerId);
                const selectedItem = products.find(p => p.id == orderForm.itemId);

                const res = await fetch('http://localhost:5000/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        customerId: selectedCust.id,
                        customerName: selectedCust.name,
                        itemId: selectedItem.id,
                        itemName: selectedItem.item_name,
                        quantity: orderForm.quantity,
                        unitPrice: selectedItem.selling_price,
                        paymentMethod: orderForm.paymentMethod
                    })
                });
                if(res.ok) {
                    alert('Order Placed Successfully!');
                    fetchData();
                    setView('orders');
                }
            };

            const updateOrderStatus = async (id, status) => {
                const res = await fetch(`http://localhost:5000/api/orders/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status })
                });
                if(res.ok) {
                    fetchData();
                }
            };

            const logout = () => {
                localStorage.clear();
                setToken(null);
                setRole(null);
            };

            // Auth Screen
            if (!token) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-900 p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                            <div className="flex justify-between mb-6">
                                <h2 className="text-2xl font-bold text-gray-800">{isRegister ? 'Register Business' : 'Login Panel'}</h2>
                                <button onClick={() => setLang(lang === 'EN' ? 'SI' : 'EN')} className="bg-blue-100 px-3 py-1 rounded-full text-xs font-semibold text-blue-600">
                                    {lang === 'EN' ? 'සිංහල' : 'English'}
                                </button>
                            </div>
                            
                            <form onSubmit={isRegister ? handleRegister : handleLogin} className="space-y-4">
                                {isRegister && (
                                    <>
                                        <input type="text" placeholder="Full Name" className="w-full p-3 border rounded-xl" onChange={e => setAuthForm({...authForm, fullName: e.target.value})} required />
                                        <input type="text" placeholder="Business Name" className="w-full p-3 border rounded-xl" onChange={e => setAuthForm({...authForm, companyName: e.target.value})} required />
                                        <input type="text" placeholder="Phone Number" className="w-full p-3 border rounded-xl" onChange={e => setAuthForm({...authForm, phone: e.target.value})} required />
                                        <input type="email" placeholder="Email Address" className="w-full p-3 border rounded-xl" onChange={e => setAuthForm({...authForm, email: e.target.value})} required />
                                    </>
                                )}
                                <input type="text" placeholder="Username" className="w-full p-3 border rounded-xl" onChange={e => setAuthForm({...authForm, username: e.target.value})} required />
                                <input type="password" placeholder="Password" className="w-full p-3 border rounded-xl" onChange={e => setAuthForm({...authForm, password: e.target.value})} required />
                                
                                <button type="submit" className="w-full bg-blue-600 text-white p-3 rounded-xl font-semibold shadow-lg hover:bg-blue-700 transition">
                                    {isRegister ? 'Register' : 'Sign In'}
                                </button>
                            </form>

                            <p className="mt-4 text-center text-sm text-gray-600 cursor-pointer" onClick={() => setIsRegister(!isRegister)}>
                                {isRegister ? 'Already have an account? Login' : 'New Business? Register here'}
                            </p>
                        </div>
                    </div>
                );
            }

            // Main Application View
            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar / Bottom Nav (Mobile Navigation Friendly) */}
                    <aside className="bg-gray-800 text-white w-full md:w-64 p-5 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center justify-between mb-8">
                                <h1 className="text-xl font-bold tracking-wider">SL-BIZ PRO</h1>
                                <span className="bg-green-500 text-xs px-2 py-1 rounded text-black font-bold">{role}</span>
                            </div>
                            <nav className="space-y-2">
                                <button onClick={() => setView('dashboard')} className={`w-full text-left p-3 rounded-xl font-medium ${view === 'dashboard' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>📊 Dashboard</button>
                                <button onClick={() => setView('orders')} className={`w-full text-left p-3 rounded-xl font-medium ${view === 'orders' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>📦 Orders</button>
                                <button onClick={() => setView('products')} className={`w-full text-left p-3 rounded-xl font-medium ${view === 'products' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>🛒 Products Inventory</button>
                                <button onClick={() => setView('customers')} className={`w-full text-left p-3 rounded-xl font-medium ${view === 'customers' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>👥 Customers</button>
                                {role === 'ADMIN' && <button onClick={() => setView('employees')} className={`w-full text-left p-3 rounded-xl font-medium ${view === 'employees' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>👔 Employees</button>}
                            </nav>
                        </div>
                        <button onClick={logout} className="mt-8 w-full bg-red-600 p-3 rounded-xl font-bold hover:bg-red-700 transition">🚪 Logout</button>
                    </aside>

                    {/* Main Dynamic Content Area */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        
                        {/* VIEW: DASHBOARD */}
                        {view === 'dashboard' && (
                            <div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-6">Overview</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-gray-500 text-sm font-semibold">Total Revenue</p>
                                        <h3 className="text-2xl font-bold text-gray-800 mt-2">Rs. {orders.reduce((acc, obj) => acc + (obj.status === 'Approved' ? obj.total_amount : 0), 0).toFixed(2)}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-gray-500 text-sm font-semibold">Total Orders Placed</p>
                                        <h3 className="text-2xl font-bold text-gray-800 mt-2">{orders.length}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-gray-500 text-sm font-semibold">Active Inventory Items</p>
                                        <h3 className="text-2xl font-bold text-gray-800 mt-2">{products.length}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-gray-500 text-sm font-semibold">Total Customers</p>
                                        <h3 className="text-2xl font-bold text-gray-800 mt-2">{customers.length}</h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW: ORDERS */}
                        {view === 'orders' && (
                            <div>
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Order Management</h2>
                                    <button onClick={() => setView('new_order')} className="bg-green-600 text-white px-4 py-2 rounded-xl font-semibold shadow-md">+ Create New Order</button>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm overflow-hidden border">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-gray-50 border-b">
                                            <tr>
                                                <th className="p-4 font-semibold text-gray-600">Order No</th>
                                                <th className="p-4 font-semibold text-gray-600">Customer</th>
                                                <th className="p-4 font-semibold text-gray-600">Item</th>
                                                <th className="p-4 font-semibold text-gray-600">Total</th>
                                                <th className="p-4 font-semibold text-gray-600">Status</th>
                                                {role === 'ADMIN' && <th className="p-4 font-semibold text-gray-600">Actions</th>}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {orders.map(order => (
                                                <tr key={order.id} className="border-b hover:bg-gray-50">
                                                    <td className="p-4 font-medium text-gray-800">{order.order_number}</td>
                                                    <td className="p-4 text-gray-600">{order.customer_name}</td>
                                                    <td className="p-4 text-gray-600">{order.item_name} (x{order.quantity})</td>
                                                    <td className="p-4 font-semibold text-gray-900">Rs. {order.total_amount.toFixed(2)}</td>
                                                    <td className="p-4">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${order.status === 'Pending' ? 'bg-amber-100 text-amber-700' : order.status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                            {order.status}
                                                        </span>
                                                    </td>
                                                    {role === 'ADMIN' && order.status === 'Pending' && (
                                                        <td className="p-4 space-x-2">
                                                            <button onClick={() => updateOrderStatus(order.id, 'Approved')} className="bg-green-600 text-white text-xs px-3 py-1 rounded-lg">Approve</button>
                                                            <button onClick={() => updateOrderStatus(order.id, 'Rejected')} className="bg-red-600 text-white text-xs px-3 py-1 rounded-lg">Reject</button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* VIEW: NEW ORDER */}
                        {view === 'new_order' && (
                            <div className="max-w-xl bg-white p-6 rounded-2xl shadow-sm border mx-auto">
                                <h2 className="text-xl font-bold mb-4">Place New Order</h2>
                                <form onSubmit={handleCreateOrder} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Select Customer</label>
                                        <select className="w-full p-3 border rounded-xl" onChange={e => setOrderForm({...orderForm, customerId: e.target.value})} required>
                                            <option value="">-- Choose Customer --</option>
                                            {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Select Product Item</label>
                                        <select className="w-full p-3 border rounded-xl" onChange={e => setOrderForm({...orderForm, itemId: e.target.value})} required>
                                            <option value="">-- Choose Product --</option>
                                            {products.map(p => <option key={p.id} value={p.id}>{p.item_name} (Available: {p.quantity}) - Rs.{p.selling_price}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Quantity</label>
                                        <input type="number" min="1" className="w-full p-3 border rounded-xl" value={orderForm.quantity} onChange={e => setOrderForm({...orderForm, quantity: parseInt(e.target.value)})} required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Payment Method</label>
                                        <select className="w-full p-3 border rounded-xl" onChange={e => setOrderForm({...orderForm, paymentMethod: e.target.value})}>
                                            <option value="Cash">Cash</option>
                                            <option value="Bank Transfer">Bank Transfer</option>
                                            <option value="Cheque">Cheque</option>
                                            <option value="Credit Sales">Credit Sales</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white p-3 rounded-xl font-bold shadow-md hover:bg-blue-700 transition">Submit Order</button>
                                </form>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = RoyalDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
